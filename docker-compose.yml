services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped

  adnk-bot:
    container_name: adnk-bot
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
      - VOICEVOX_BASE_URL=http://voicevox:50021
    restart: unless-stopped
    depends_on:
      - voicevox
    
    volumes:
      - ./data:/app/data
